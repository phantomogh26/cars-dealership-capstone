name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd server
          pip install -r requirements.txt

      - name: Install flake8
        run: pip install flake8

      - name: Lint with flake8
        run: |
          cd server
          flake8 . --max-line-length=120 --exclude=migrations,venv --exit-zero

      - name: Run Django system checks
        run: |
          cd server
          python manage.py check

      - name: Run tests
        run: |
          cd server
          python manage.py test
